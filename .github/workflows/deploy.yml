name: 🛠️ Build Docker Image

# ========================================
# 触发条件：
# - main 分支推送 → latest 标签
# - develop 分支推送 → develop 标签  
# - tag 推送 (v*) → 对应版本标签
# ========================================
on:
  push:
    branches: [main, develop]
    tags: ['v*']

env:
  PROJECT_NAME: portal-console-web
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: ray321

jobs:
  build:
    name: 🛠️ Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 根据分支/tag 生成镜像标签
      - name: Generate image tag
        id: meta
        run: |
          IMAGE_NAME=${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.PROJECT_NAME }}
          
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # tag 推送: v1.0.0 → 1.0.0
            IMAGE_TAG=${GITHUB_REF#refs/tags/v}
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # main 分支 → latest
            IMAGE_TAG=latest
          elif [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            # develop 分支 → develop
            IMAGE_TAG=develop
          else
            # 其他分支 → 分支名
            IMAGE_TAG=${GITHUB_REF#refs/heads/}
          fi
          
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "🏷️ 镜像: $IMAGE_NAME:$IMAGE_TAG"

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "✅ 镜像构建完成"
          echo "📦 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo ""
          echo "在 Kuboard 中手动更新镜像版本即可部署"

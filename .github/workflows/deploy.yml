name: 🚀 Build & Deploy to Production

on:
  push:
    branches: [main]

# ========================================
# 🔧 项目配置变量（复用到其他项目时只需修改这里）
# ========================================
env:
  # 项目基本信息
  PROJECT_NAME: portal-console-web # 项目名称（用于资源命名）
  GITHUB_REPO: tt472625987/portal-console-web # GitHub 仓库地址

  # 腾讯云容器镜像服务 TCR 配置
  TCR_REGISTRY: ccr.ccs.tencentyun.com # TCR 访问域名 (请根据实际情况修改，例如 ccr.ccs.tencentyun.com 或企业版域名)
  TCR_NAMESPACE: ray321 # TCR 命名空间

  # Kubernetes 配置
  K8S_NAMESPACE: default # K8s 命名空间
  K8S_DEPLOYMENT_FILE: deployment.yaml # K8s 部署文件名

  # 健康检查配置
  HEALTH_CHECK_PATH: / # 健康检查路径
  CONTAINER_PORT: 80 # 容器端口

  # 部署超时时间（秒）
  ROLLOUT_TIMEOUT: 180

jobs:
  # =============================
  # 1️⃣ 构建镜像并推送到腾讯 TCR
  # =============================
  build:
    name: 🛠️ Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      # 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITHUB_REPO }}
          fetch-depth: 0

      # 设置 Docker Buildx (支持高级缓存)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录腾讯云容器镜像服务 TCR
      - name: Login to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 生成镜像标签（构建号 + commit 短码）
      - name: Generate image metadata
        id: meta
        run: |
          # 镜像地址
          IMAGE_NAME=${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.PROJECT_NAME }}

          # 镜像标签：build-构建号-commit短码
          IMAGE_TAG="build-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"

          # 输出给后续步骤
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          echo "🏷️  镜像标签: $IMAGE_TAG"
          echo "📤 推送地址: $IMAGE_NAME:$IMAGE_TAG"

      # 构建并推送镜像 (使用 BuildKit 缓存)
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # 使用 GitHub Actions 缓存 (免费、快速)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 只构建 amd64 避免多架构浪费时间
          platforms: linux/amd64

  # =============================
  # 2️⃣ 部署到 Kubernetes 集群
  # =============================
  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      # 拉取仓库代码 (需要 deployment.yaml)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITHUB_REPO }}
          fetch-depth: 0

      # 安装 kubectl (防止 Runner 环境缺失)
      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "kubectl not found, installing..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/
          else
            echo "kubectl is already installed"
          fi

      # 配置 K8s 访问
      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          # 设置环境变量，使其在后续所有步骤中生效
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

          # 显示集群 API 地址
          echo "📍 集群 API 地址："
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          echo ""

          # 验证集群连接
          echo "🔍 验证集群连接..."
          kubectl cluster-info --request-timeout=10s
          echo "✅ K8s 集群连接成功"

      # 同步 COS Secrets 到 Kubernetes（如果项目需要）
      - name: Sync COS Secrets to Kubernetes
        run: |
          cat <<EOF_SECRET | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: cos-secret-${{ env.PROJECT_NAME }}
            namespace: ${{ env.K8S_NAMESPACE }}
          type: Opaque
          stringData:
            COS_SECRET_ID: "${{ secrets.COS_SECRET_ID }}"
            COS_SECRET_KEY: "${{ secrets.COS_SECRET_KEY }}"
          EOF_SECRET
          echo "✅ COS Secrets 已同步"

      # 创建腾讯云 TCR 镜像拉取凭证
      - name: Create Tencent TCR Pull Secret
        run: |
          # 删除旧的 secret（如果存在）
          kubectl delete secret tencent-tcr-secret -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true

          # 创建新的 docker-registry secret
          kubectl create secret docker-registry tencent-tcr-secret \
            --docker-server=${{ env.TCR_REGISTRY }} \
            --docker-username="${{ secrets.TCR_USERNAME }}" \
            --docker-password="${{ secrets.TCR_PASSWORD }}" \
            --namespace=${{ env.K8S_NAMESPACE }}

          echo "✅ 腾讯云 TCR 镜像拉取凭证已创建"

      # 替换镜像并部署
      - name: Apply deployment
        run: |
          IMAGE=${{ needs.build.outputs.image }}
          TAG=${{ needs.build.outputs.tag }}

          sed -i "s|__IMAGE_NAME__|$IMAGE|g" ${{ env.K8S_DEPLOYMENT_FILE }}
          sed -i "s|__IMAGE_TAG__|$TAG|g" ${{ env.K8S_DEPLOYMENT_FILE }}

          echo "🚀 部署版本: $IMAGE:$TAG"
          kubectl apply -f ${{ env.K8S_DEPLOYMENT_FILE }}

      # 检查部署状态并自动回滚（防止坏版本）
      - name: Verify rollout & rollback if failed
        run: |
          DEPLOY_NAME=${{ env.PROJECT_NAME }}-deployment
          set -e
          if kubectl rollout status deployment/$DEPLOY_NAME --timeout=${{ env.ROLLOUT_TIMEOUT }}s; then
            echo "✅ 部署成功"
          else
            echo "❌ 部署失败，开始回滚..."
            kubectl rollout undo deployment/$DEPLOY_NAME
            echo "🩹 已回滚到上一个稳定版本"
            exit 1
          fi

      # 部署完成通知（可选）
      - name: Notify Deployment Result
        if: always()
        run: |
          STATUS=${{ job.status }}
          IMAGE=${{ needs.build.outputs.image }}
          TAG=${{ needs.build.outputs.tag }}
          echo "📢 部署状态: $STATUS"
          echo "📦 镜像: $IMAGE:$TAG"
